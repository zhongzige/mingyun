<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIXER ESTUDIO · 命运预测</title>
<style>
/* =================================================================
   命运预测 V1.6 — Apple Dark Design System
   名人匹配优化：人生走向匹配 + 名人生平简介
   ================================================================= */

@font-face{font-family:'SF Pro Display';src:local('SF Pro Display'),local('SFProDisplay-Regular');font-weight:400;font-display:swap}
@font-face{font-family:'SF Pro Display';src:local('SF Pro Display'),local('SFProDisplay-Semibold');font-weight:600;font-display:swap}
@font-face{font-family:'SF Pro Text';src:local('SF Pro Text'),local('SFProText-Regular');font-weight:400;font-display:swap}
@font-face{font-family:'SF Pro Text';src:local('SF Pro Text'),local('SFProText-Semibold');font-weight:600;font-display:swap}

:root{
  --bg:#000000;--surface:#1a1a1d;--card:#242426;--card2:#272729;
  --b-sub:rgba(255,255,255,0.06);--b-mid:rgba(255,255,255,0.1);--b-hi:rgba(255,255,255,0.2);
  --text:#ffffff;--text2:rgba(255,255,255,0.7);--text3:rgba(255,255,255,0.4);
  --accent:#0071e3;--accent-hover:#0077ed;--accent-text:#2997ff;
  --danger:#ff453a;--success:#30d158;--warning:#ff9f0a;
  --star-bright:#ffd60a;--star-dim:rgba(255,255,255,0.35);
  --font-sans:'SF Pro Text',-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --font-display:'SF Pro Display','SF Pro Text',-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;
  --radius:8px;--radius-lg:12px;--radius-xl:16px;--transition:0.2s ease;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-sans);font-size:14px;font-weight:400;
  letter-spacing:-0.22px;line-height:1.47;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
.app{min-height:100vh;display:flex;flex-direction:column}

/* ===== TOOLBAR ===== */
.toolbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 22px;height:48px;
  background:rgba(28,28,30,0.8);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:0.5px solid rgba(255,255,255,0.08);
  flex-shrink:0;gap:16px;position:sticky;top:0;z-index:100;
}
.toolbar-brand{display:flex;align-items:center;gap:10px}
.toolbar-logo{
  width:20px;height:20px;border-radius:5px;
  background:linear-gradient(135deg,#7f77dd,#d4537e,#d85a30);
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:white;
}
.toolbar-title{font-size:13px;font-weight:500;letter-spacing:-0.16px;color:var(--text)}
.toolbar-actions{display:flex;gap:8px;align-items:center}

/* ===== BUTTONS ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:5px 14px;border-radius:980px;font-size:12px;font-weight:400;
  letter-spacing:-0.12px;cursor:pointer;border:none;
  background:rgba(255,255,255,0.08);color:var(--text);
  transition:all var(--transition);font-family:var(--font-sans);white-space:nowrap;
}
.btn:hover{background:rgba(255,255,255,0.12)}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{background:#0077ed;box-shadow:0 4px 16px rgba(0,113,227,0.3)}
.btn-outline{background:transparent;color:var(--accent);border:0.5px solid rgba(0,113,227,0.4)}
.btn-outline:hover{background:rgba(0,113,227,0.06);border-color:var(--accent)}
.btn:active{transform:scale(0.97)}
.btn:disabled{opacity:0.3;cursor:not-allowed;pointer-events:none;transform:none}

/* ===== MAIN ===== */
.main{
  flex:1;display:flex;justify-content:center;padding:36px 28px 48px;
  overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.08) transparent;
}
.main::-webkit-scrollbar{width:4px}
.main::-webkit-scrollbar-track{background:transparent}
.main::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px}
.main-inner{width:100%;max-width:900px;display:flex;flex-direction:column;gap:20px}

/* ===== CARD BASE ===== */
.card{
  background:var(--card);border-radius:var(--radius-xl);
  border:0.5px solid rgba(255,255,255,0.06);padding:24px 28px;
}
.card-header{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;
}
.card-title{font-size:13px;font-weight:500;color:var(--text2);letter-spacing:-0.12px}
.card-badge{font-size:11px;color:var(--text3);letter-spacing:-0.08px}

/* ===== INPUT FORM ===== */
.form-grid{display:flex;flex-direction:column;gap:14px}

.form-row{
  display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;
}

.input-group{display:flex;flex-direction:column;gap:5px}
.input-group label{
  font-size:11px;font-weight:400;color:var(--text3);letter-spacing:-0.08px;
}
.input-group input,.input-group select{
  background:var(--surface);border:0.5px solid rgba(255,255,255,0.08);
  border-radius:var(--radius);color:var(--text);
  font-family:var(--font-sans);font-size:14px;font-weight:400;
  padding:10px 12px;outline:none;transition:all var(--transition);
  -webkit-appearance:none;appearance:none;height:40px;
}
.input-group input:focus,.input-group select:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,0.1);
}
.input-group input:hover,.input-group select:hover{border-color:rgba(255,255,255,0.2)}
.input-group input::placeholder{color:rgba(255,255,255,0.2);font-size:13px}
.input-group select{
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='rgba(255,255,255,0.4)' stroke-width='1.2' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;padding-right:28px;
  cursor:pointer;
}

/* Date selector widths */
.input-name{width:160px}
.input-year{width:100px}.input-month{width:80px}.input-day{width:80px}
.input-province{width:130px}.input-city{width:130px}
.input-hour{width:80px}.input-minute{width:80px}

/* Section label */
.section-label{
  font-size:11px;font-weight:400;color:var(--text3);letter-spacing:-0.08px;
  align-self:flex-end;margin-bottom:5px;margin-right:4px;
}

/* Converted time display */
.time-convert{
  display:flex;align-items:center;gap:6px;
  font-size:12px;color:var(--accent-text);letter-spacing:-0.08px;
  padding:4px 10px;background:rgba(0,113,227,0.06);
  border-radius:var(--radius);white-space:nowrap;height:28px;align-self:flex-end;margin-bottom:6px;
}

/* Unknown time checkbox */
.checkbox-row{
  display:flex;align-items:center;gap:6px;
  cursor:pointer;user-select:none;-webkit-user-select:none;
  align-self:flex-end;margin-bottom:5px;white-space:nowrap;
}
.checkbox-row input[type="checkbox"]{
  display:none;
}
.checkbox-box{
  width:16px;height:16px;border-radius:4px;
  border:1px solid rgba(255,255,255,0.2);
  display:flex;align-items:center;justify-content:center;
  transition:all var(--transition);flex-shrink:0;
}
.checkbox-row input:checked + .checkbox-box{
  background:var(--accent);border-color:var(--accent);
}
.checkbox-box::after{
  content:'';display:block;width:4px;height:8px;
  border:solid #fff;border-width:0 1.5px 1.5px 0;
  transform:rotate(45deg) translateY(-1px);
  opacity:0;transition:opacity var(--transition);
}
.checkbox-row input:checked + .checkbox-box::after{opacity:1}
.checkbox-label{font-size:12px;color:var(--text3);letter-spacing:-0.08px}

/* ===== GENDER SELECTOR ===== */
.gender-row{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.gender-toggle-v2{display:flex;gap:8px}
.gender-btn-v2{
  display:flex;align-items:center;gap:6px;
  padding:9px 20px;border-radius:var(--radius);
  font-size:13px;font-weight:400;font-family:var(--font-sans);
  cursor:pointer;border:0.5px solid rgba(255,255,255,0.1);
  background:var(--surface);color:var(--text2);
  transition:all var(--transition);letter-spacing:-0.08px;
}
.gender-btn-v2:hover{border-color:rgba(255,255,255,0.25);color:var(--text)}
.gender-btn-v2.active{
  background:var(--accent);border-color:var(--accent);color:#fff;
}
.gender-icon{font-size:15px;letter-spacing:0}

/* ===== BIG GENERATE BUTTON ===== */
.btn-generate{
  padding:12px 36px;font-size:14px;font-weight:500;
  letter-spacing:2px;height:40px;
  background:linear-gradient(135deg,#7f77dd,#d4537e);
  border:none;border-radius:var(--radius);
  color:#fff;cursor:pointer;font-family:var(--font-display);
  transition:all var(--transition);white-space:nowrap;
  box-shadow:0 2px 12px rgba(127,119,221,0.25);
}
.btn-generate:hover{
  box-shadow:0 4px 24px rgba(212,83,126,0.4);
  transform:translateY(-1px);
}
.btn-generate:active{transform:scale(0.98) translateY(0)}

/* ===== API KEY SECTION ===== */
.api-row{
  display:flex;align-items:center;gap:8px;padding-top:2px;
}
.api-label{font-size:11px;color:var(--text3);white-space:nowrap;letter-spacing:-0.08px}
.api-input{
  flex:1;background:var(--surface);border:0.5px solid rgba(255,255,255,0.08);
  border-radius:var(--radius);color:var(--text);padding:6px 10px;height:32px;
  font-family:var(--font-sans);font-size:11px;outline:none;
  transition:all var(--transition);letter-spacing:-0.08px;
}
.api-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,0.1)}
.api-input::placeholder{color:rgba(255,255,255,0.2)}
.api-status{font-size:10px;padding:3px 8px;border-radius:4px;white-space:nowrap;letter-spacing:-0.08px}
.api-status.set{color:var(--success);background:rgba(48,209,88,0.1)}
.api-status.unset{color:var(--text3);background:rgba(255,255,255,0.04)}

/* ===== CHART CARD ===== */
.chart-grid-outer{display:flex;justify-content:center;padding:8px 0}
.chart-grid{
  display:grid;grid-template-columns:1fr 1fr 1fr 1fr;
  grid-template-rows:auto auto auto auto;
  gap:6px;width:100%;max-width:760px;
}

.palace-cell{
  background:var(--surface);border-radius:var(--radius);
  border:0.5px solid rgba(255,255,255,0.06);
  padding:8px 10px;min-height:64px;
  transition:all var(--transition);cursor:default;
  display:flex;flex-direction:column;gap:2px;
}
.palace-cell:hover{border-color:rgba(255,255,255,0.12);background:#1f1f23}
.palace-cell.soul-palace{border-color:rgba(255,69,58,0.3);box-shadow:inset 0 0 0 1px rgba(255,69,58,0.08)}
.palace-cell.body-palace{border-color:rgba(0,113,227,0.3);box-shadow:inset 0 0 0 1px rgba(0,113,227,0.08)}
.palace-header{display:flex;align-items:center;gap:6px}
.palace-branch{font-size:12px;font-weight:500;color:var(--text2)}
.palace-stem{font-size:10px;color:var(--text3);letter-spacing:0}
.palace-name{font-size:13px;font-weight:500;color:var(--text);line-height:1.2}
.palace-stars{display:flex;flex-wrap:wrap;gap:3px 6px;margin-top:2px}
.star-tag{font-size:11px;letter-spacing:-0.06px;line-height:1.3}
.star-tag.bright{color:var(--star-bright)}
.star-tag.medium{color:var(--text2)}
.star-tag.dim{color:var(--star-dim)}
.palace-badges{display:flex;gap:4px;margin-top:2px}
.palace-badge{
  font-size:9px;padding:1px 5px;border-radius:3px;
  font-weight:400;letter-spacing:-0.06px;
}
.palace-badge.soul-badge{background:rgba(255,69,58,0.12);color:var(--danger)}
.palace-badge.body-badge{background:rgba(0,113,227,0.1);color:var(--accent-text)}

.center-info{
  background:var(--card2);border-radius:var(--radius);
  border:0.5px solid rgba(255,255,255,0.1);
  grid-column:2/4;grid-row:2/4;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:16px;gap:10px;text-align:center;
}
.center-name{font-size:16px;font-weight:600;color:var(--text);letter-spacing:-0.2px}
.center-pillar{font-size:20px;font-weight:400;color:var(--text);font-family:var(--font-display);letter-spacing:2px;line-height:1.4}
.center-meta{display:flex;flex-direction:column;gap:4px}
.center-meta-row{font-size:11px;color:var(--text3);letter-spacing:-0.08px;display:flex;gap:12px;justify-content:center}
.center-meta-row span{color:var(--text2)}

.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:48px 24px;text-align:center;gap:8px;
}
.empty-icon{font-size:32px;opacity:0.3}
.empty-title{font-size:14px;font-weight:400;color:var(--text2);letter-spacing:-0.12px}
.empty-sub{font-size:12px;color:var(--text3);letter-spacing:-0.08px;max-width:300px}

/* ===== AI INTERPRETATION ===== */
.interpretation-content{
  font-size:14px;line-height:1.8;color:var(--text2);
  letter-spacing:-0.12px;white-space:pre-wrap;word-break:break-word;
}
.interpretation-loading{
  display:flex;align-items:center;justify-content:center;padding:32px;gap:8px;
}
.spinner{
  width:16px;height:16px;border:2px solid rgba(255,255,255,0.1);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin 0.6s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--text3);letter-spacing:-0.08px}

/* ===== FOOTER ===== */
.footer{
  border-top:0.5px solid rgba(255,255,255,0.06);
  padding:12px 22px 16px;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:8px;flex-shrink:0;
}
.footer-text{font-size:10px;color:var(--text3);letter-spacing:-0.06px}
.footer-link{color:var(--accent-text);text-decoration:none;font-size:10px}
.footer-link:hover{text-decoration:underline}

/* ===== RESPONSIVE ===== */
@media(max-width:700px){
  .chart-grid{grid-template-columns:1fr 1fr;gap:4px}
  .center-info{grid-column:1/3;grid-row:auto;min-height:100px}
  .form-row{gap:8px}
  .input-name{width:140px}.input-year{width:90px}.input-month{width:75px}.input-day{width:75px}
  .input-province{width:120px}.input-city{width:120px}
  .input-hour{width:70px}.input-minute{width:70px}
}
</style>
</head>
<body>
<div class="app">

<!-- Toolbar -->
<div class="toolbar">
  <div class="toolbar-brand">
    <div class="toolbar-logo">命</div>
    <span class="toolbar-title">FIXER ESTUDIO 命运预测工具</span>
  </div>
  <div class="toolbar-actions">
    <span class="api-status unset" id="apiStatus">未配置 API</span>
  </div>
</div>

<!-- Main -->
<div class="main">
<div class="main-inner">

<!-- Input Card -->
<div class="card" id="inputCard">
  <div class="card-header">
    <span class="card-title">输入生辰信息</span>
  </div>
  <div class="form-grid">

    <!-- Row 1: Name -->
    <div class="form-row">
      <div class="input-group">
        <label>姓名（可选）</label>
        <input type="text" id="userName" class="input-name" placeholder="匿名访客" maxlength="20">
      </div>
    </div>

    <!-- Row 2: Year/Month/Day + Location -->
    <div class="form-row">
      <div class="input-group">
        <label>出生日期（阳历）</label>
        <div style="display:flex;gap:6px">
          <select id="birthYear" class="input-year">
            <option value="">年</option>
          </select>
          <select id="birthMonth" class="input-month">
            <option value="">月</option>
          </select>
          <select id="birthDay" class="input-day">
            <option value="">日</option>
          </select>
        </div>
      </div>
      <div class="input-group">
        <label>出生地点</label>
        <div style="display:flex;gap:6px">
          <select id="birthProvince" class="input-province">
            <option value="">省份</option>
          </select>
          <select id="birthCity" class="input-city">
            <option value="">城市</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Row 3: Time + Checkbox + Converted display -->
    <div class="form-row">
      <div class="input-group" id="timeGroup">
        <label>出生时间</label>
        <div style="display:flex;gap:6px;align-items:center">
          <select id="birthHour" class="input-hour">
            <option value="">时</option>
          </select>
          <span style="color:var(--text3);font-size:12px">:</span>
          <select id="birthMinute" class="input-minute">
            <option value="">分</option>
          </select>
        </div>
      </div>
      <div class="time-convert" id="timeConvert" style="display:none">
        → 真太阳时 <span id="timeConvertText" style="font-weight:500;color:var(--text)">--</span>
      </div>
      <label class="checkbox-row" id="unknownTimeLabel">
        <input type="checkbox" id="unknownTime">
        <span class="checkbox-box"></span>
        <span class="checkbox-label">不知道出生时间</span>
      </label>
    </div>

    <!-- Row 4: Gender + Button -->
    <div class="form-row" style="align-items:center">
      <div class="input-group">
        <label>性别</label>
        <div class="gender-toggle-v2" id="genderToggle">
          <button class="gender-btn-v2 active" data-gender="男">
            <span class="gender-icon">&#9794;</span> 男
          </button>
          <button class="gender-btn-v2" data-gender="女">
            <span class="gender-icon">&#9792;</span> 女
          </button>
        </div>
      </div>
      <button class="btn-generate" id="btnGenerate" style="margin-left:auto">
        立即起盘 · 解命运密码
      </button>
    </div>

  </div>

  <!-- Topic Selector -->
  <div class="api-row" style="padding-top:0">
    <span class="api-label">解读方向</span>
    <select id="aiTopic" class="api-input" style="width:170px;font-size:12px;height:32px;cursor:pointer">
      <option value="general" selected>综合解读</option>
      <option value="personality">性格与命格</option>
      <option value="career">事业运</option>
      <option value="wealth">财运</option>
      <option value="love">感情婚恋</option>
      <option value="health">健康运</option>
      <option value="home">田宅家庭</option>
      <option value="social">人际关系</option>
      <option value="inner">内心与福德</option>
      <option value="horoscope">大限流年</option>
    </select>
  </div>

  <!-- Style Selector -->
  <div class="api-row" style="padding-top:0">
    <span class="api-label">解读风格</span>
    <select id="aiStyle" class="api-input" style="width:170px;font-size:12px;height:32px;cursor:pointer">
      <option value="plain" selected>冷静直白风</option>
      <option value="chat">朋友聊天口吻</option>
      <option value="master">专业命理师口吻</option>
      <option value="counselor">心理咨询师口吻</option>
      <option value="roast">毒舌吐槽风</option>
    </select>
  </div>

  <!-- API Key -->
  <div class="api-row" style="margin-top:16px;border-top:0.5px solid rgba(255,255,255,0.06);padding-top:14px">
    <span class="api-label">AI 解读密钥</span>
    <input type="password" id="apiKey" class="api-input" placeholder="粘贴 DeepSeek API Key（可选，用于 AI 解读）">
    <button class="btn btn-outline" id="btnSaveKey" style="padding:4px 14px;font-size:11px;height:32px">保存</button>
  </div>
</div>

<!-- Chart Section -->
<div class="card" id="chartCard">
  <div class="card-header">
    <span class="card-title">紫微命盘</span>
    <span class="card-badge" id="chartBadge"></span>
  </div>
  <div id="chartContent">
    <div class="empty-state">
      <div class="empty-icon">✦</div>
      <div class="empty-title">输入生辰信息，揭示你的星空密码</div>
      <div class="empty-sub">基于开源 iztro 引擎，瞬间排出完整的紫微斗数十二宫命盘</div>
    </div>
  </div>
</div>

<!-- AI Interpretation -->
<div class="card" id="aiCard" style="display:none">
  <div class="card-header">
    <span class="card-title">AI 命运解读</span>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="card-badge">DeepSeek</span>
      <button class="btn btn-outline" id="btnCopyInterpretation" style="padding:3px 10px;font-size:10px;height:24px;display:none">复制</button>
    </div>
  </div>
  <div id="aiContent"></div>
</div>

</div>
</div>

<!-- Footer -->
<div class="footer">

// ---- Init ----
function init() {
  document.getElementById('apiKey').value = apiKey;
  updateApiStatus();

  // Populate year/month/day/hour/minute selectors
  populateYearSelect();
  populateMonthSelect();
  populateHourSelect();
  populateMinuteSelect();
  populateProvinceSelect();

  // Event listeners
  document.getElementById('btnGenerate').addEventListener('click', generateChart);
  document.getElementById('btnSaveKey').addEventListener('click', saveApiKey);
  document.getElementById('btnCopyInterpretation').addEventListener('click', copyInterpretation);

  document.getElementById('birthYear').addEventListener('change', updateDaySelect);
  document.getElementById('birthMonth').addEventListener('change', updateDaySelect);

  document.getElementById('birthProvince').addEventListener('change', updateCitySelect);
  document.getElementById('birthCity').addEventListener('change', updateTimeConvert);

  document.getElementById('birthHour').addEventListener('change', updateTimeConvert);
  document.getElementById('birthMinute').addEventListener('change', updateTimeConvert);

  document.getElementById('unknownTime').addEventListener('change', toggleUnknownTime);

  // Gender toggle
  document.querySelectorAll('.gender-btn-v2').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.gender-btn-v2').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  // Set default date to 2000-01-01
  document.getElementById('birthYear').value = '2000';
  document.getElementById('birthMonth').value = '1';
  updateDaySelect();
  document.getElementById('birthDay').value = '1';

  // Set default time to 12:00
  document.getElementById('birthHour').value = '12';
  document.getElementById('birthMinute').value = '0';
}

// ---- Populate Selectors ----
function populateYearSelect() {
  const sel = document.getElementById('birthYear');
  for (let y = 2030; y >= 1900; y--) {
    const opt = document.createElement('option');
    opt.value = y;
    opt.textContent = y + '年';
    sel.appendChild(opt);
  }
}

function populateMonthSelect() {
  const sel = document.getElementById('birthMonth');
  for (let m = 1; m <= 12; m++) {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m + '月';
    sel.appendChild(opt);
  }
}

function updateDaySelect() {
  const y = parseInt(document.getElementById('birthYear').value);
  const m = parseInt(document.getElementById('birthMonth').value);
  const sel = document.getElementById('birthDay');
  sel.innerHTML = '<option value="">日</option>';
  if (!y || !m) return;
  const days = new Date(y, m, 0).getDate();
  for (let d = 1; d <= days; d++) {
    const opt = document.createElement('option');
    opt.value = d;
    opt.textContent = d + '日';
    sel.appendChild(opt);
  }
}

function populateHourSelect() {
  const sel = document.getElementById('birthHour');
  for (let h = 0; h <= 23; h++) {
    const opt = document.createElement('option');
    opt.value = h;
    opt.textContent = String(h).padStart(2, '0');
    sel.appendChild(opt);
  }
}

function populateMinuteSelect() {
  const sel = document.getElementById('birthMinute');
  for (let m = 0; m <= 59; m++) {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = String(m).padStart(2, '0');
    sel.appendChild(opt);
  }
}

function populateProvinceSelect() {
  const sel = document.getElementById('birthProvince');
  const provinces = Object.keys(cityData).sort((a,b)=>{
    const order = ['北京','上海','天津','重庆','河北','山西','内蒙古','辽宁','吉林','黑龙江','江苏','浙江','安徽','福建','江西','山东','河南','湖北','湖南','广东','广西','海南','四川','贵州','云南','西藏','陕西','甘肃','青海','宁夏','新疆','香港','澳门','台湾'];
    return order.indexOf(a) - order.indexOf(b);
  });
  provinces.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p;
    opt.textContent = p;
    sel.appendChild(opt);
  });
}

function updateCitySelect() {
  const province = document.getElementById('birthProvince').value;
  const sel = document.getElementById('birthCity');
  sel.innerHTML = '<option value="">城市</option>';
  if (!province || !cityData[province]) return;
  cityData[province].forEach(c => {
    const opt = document.createElement('option');
    opt.value = JSON.stringify(c);
    opt.textContent = c.name;
    sel.appendChild(opt);
  });
  updateTimeConvert();
}

// ---- Time Conversion ----
function getSelectedCityLongitude() {
  const cityVal = document.getElementById('birthCity').value;
  if (!cityVal) return null;
  try { return JSON.parse(cityVal).lng; } catch(e) { return null; }
}

// Convert hour:minute to true solar time based on city longitude
// China standard timezone = 120°E. Offset = (120 - lng) * 4 minutes
function getTrueSolarTime() {
  const hour = parseInt(document.getElementById('birthHour').value);
  const minute = parseInt(document.getElementById('birthMinute').value);
  const lng = getSelectedCityLongitude();

  if (isNaN(hour) || isNaN(minute)) return null;
  if (lng === null) return { hour, minute, offset: 0 };

  const offsetMin = Math.round((120 - lng) * 4);
  let totalMin = hour * 60 + minute + offsetMin;
  if (totalMin < 0) totalMin += 1440;
  if (totalMin >= 1440) totalMin -= 1440;

  return {
    hour: Math.floor(totalMin / 60),
    minute: totalMin % 60,
    offset: offsetMin
  };
}

// Convert true solar time to iztro timeIndex (0-12)
function timeToIndex(hour, minute) {
  // Chinese 时辰 mapping
  if (hour === 23 || hour === 0) {
    // 子时 split: 23:00-23:59 → 晚子时(12), 00:00-00:59 → 早子时(0)
    return hour === 23 ? 12 : 0;
  }
  // 01:00-02:59 → 1(丑), 03:00-04:59 → 2(寅), ..., 21:00-22:59 → 11(亥)
  return Math.floor((hour + 1) / 2);
}

// Get 时辰 name for display
function getShichenName(idx) {
  const names = ['子时','丑时','寅时','卯时','辰时','巳时','午时','未时','申时','酉时','戌时','亥时'];
  if (idx === 12) return '子时';
  return names[idx] || '未知';
}
function getShichenRange(idx) {
  const ranges = ['23:00-01:00','01:00-03:00','03:00-05:00','05:00-07:00','07:00-09:00','09:00-11:00','11:00-13:00','13:00-15:00','15:00-17:00','17:00-19:00','19:00-21:00','21:00-23:00'];
  if (idx === 12) return '23:00-01:00';
  return ranges[idx] || '';
}

function updateTimeConvert() {
  const unknown = document.getElementById('unknownTime').checked;
  const el = document.getElementById('timeConvert');
  const txt = document.getElementById('timeConvertText');

  if (unknown) {
    el.style.display = 'none';
    return;
  }

  const ts = getTrueSolarTime();
  if (!ts) { el.style.display = 'none'; return; }

  const idx = timeToIndex(ts.hour, ts.minute);
  const name = getShichenName(idx);
  const range = getShichenRange(idx);

  el.style.display = 'flex';
  if (ts.offset === 0) {
    txt.textContent = name + ' ' + range;
  } else {
    const sign = ts.offset > 0 ? '+' : '';
    txt.textContent = name + ' ' + range + ' (偏差' + sign + ts.offset + '分)';
  }
}

function toggleUnknownTime() {
  const unknown = document.getElementById('unknownTime').checked;
  const timeGroup = document.getElementById('timeGroup');
  const timeConvert = document.getElementById('timeConvert');

  if (unknown) {
    timeGroup.style.opacity = '0.35';
    timeGroup.style.pointerEvents = 'none';
    timeConvert.style.display = 'none';
    // Default to 午时 (timeIndex=6) if unknown
    document.getElementById('birthHour').value = '12';
    document.getElementById('birthMinute').value = '0';
  } else {
    timeGroup.style.opacity = '1';
    timeGroup.style.pointerEvents = 'auto';
    updateTimeConvert();
  }
}

// ---- Data Helpers ----
function getGender() {
  const active = document.querySelector('.gender-btn-v2.active');
  return active ? active.dataset.gender : '男';
}

function getTimeIndex() {
  const unknown = document.getElementById('unknownTime').checked;
  if (unknown) return 6; // Default 午时 when unknown

  const ts = getTrueSolarTime();
  if (!ts) return 6; // Fallback

  return timeToIndex(ts.hour, ts.minute);
}

function getSolarDate() {
  const y = parseInt(document.getElementById('birthYear').value);
  const m = parseInt(document.getElementById('birthMonth').value);
  const d = parseInt(document.getElementById('birthDay').value);
  if (!y || !m || !d) return null;
  return y + '-' + m + '-' + d;
}

function getUserName() {
  const name = document.getElementById('userName').value.trim();
  return name || '匿名访客';
}

function getLocationName() {
  const province = document.getElementById('birthProvince').value;
  const cityVal = document.getElementById('birthCity').value;
  if (!province && !cityVal) return '';
  try {
    const city = cityVal ? JSON.parse(cityVal).name : '';
    return province + (city ? ' ' + city : '');
  } catch(e) { return province; }
}

// ---- Brightness level ----
function brightnessLevel(b) {
  if (!b) return 'medium';
  const bright = ['庙','旺','得'];
  const dim = ['陷','不'];
  if (bright.includes(b)) return 'bright';
  if (dim.includes(b)) return 'dim';
  return 'medium';
}

// ---- Generate Chart ----
function generateChart() {
  const solarDate = getSolarDate();
  if (!solarDate) {
    alert('请填写出生日期（年/月/日）');
    return;
  }

  const timeIndex = getTimeIndex();
  const gender = getGender();
  const userName = getUserName();

  if (typeof iztro === 'undefined' || !iztro.astro) {
    document.getElementById('chartContent').innerHTML =
      '<div class="empty-state"><div class="empty-icon">⚠</div><div class="empty-title">排盘引擎加载失败</div><div class="empty-sub">请检查网络连接后刷新页面重试</div></div>';
    return;
  }

  try {
    currentChartData = iztro.astro.bySolar(solarDate, timeIndex, gender, true, 'zh-CN');
  } catch(e) {
    document.getElementById('chartContent').innerHTML =
      '<div class="empty-state"><div class="empty-icon">⚠</div><div class="empty-title">排盘失败</div><div class="empty-sub">' + e.message + '</div></div>';
    return;
  }

  renderChart(currentChartData, userName);

  // Calculate horoscope for "大限流年" topic
  const topic = document.getElementById('aiTopic').value;
  currentHoroscope = null;
  if (topic === 'horoscope' && typeof currentChartData.horoscope === 'function') {
    try {
      const h = currentChartData.horoscope(new Date());
      const simpleHoroscope = {
        solarDate: h.solarDate,
        lunarDate: h.lunarDate,
        decadal: h.decadal ? {
          index: h.decadal.index,
          heavenlyStem: h.decadal.heavenlyStem,
          earthlyBranch: h.decadal.earthlyBranch,
          palaceNames: h.decadal.palaceNames,
          mutagen: h.decadal.mutagen
        } : null,
        yearly: h.yearly ? {
          index: h.yearly.index,
          heavenlyStem: h.yearly.heavenlyStem,
          earthlyBranch: h.yearly.earthlyBranch,
          palaceNames: h.yearly.palaceNames,
          mutagen: h.yearly.mutagen
        } : null
      };
      currentHoroscope = simpleHoroscope;
    } catch(e) {
      currentHoroscope = null;
    }
  }

  if (apiKey) {
    document.getElementById('aiCard').style.display = '';
    runAiInterpretation(currentChartData, userName);
  } else {
    document.getElementById('aiCard').style.display = 'none';
  }
}

// ---- Render Chart ----
function renderChart(data, userName) {
  const soulBranch = data.earthlyBranchOfSoulPalace;
  const bodyBranch = data.earthlyBranchOfBodyPalace;
  const loc = getLocationName();
  document.getElementById('chartBadge').textContent = userName + ' · ' + data.solarDate + ' · ' + data.time;

  let gridPalaces = {};
  data.palaces.forEach(p => {
    const pos = branchPositions[p.earthlyBranch];
    if (pos) gridPalaces[p.earthlyBranch] = p;
  });

  function renderPalaceCell(palace) {
    const isSoul = palace.earthlyBranch === soulBranch;
    const isBody = palace.earthlyBranch === bodyBranch;
    let cls = 'palace-cell';
    if (isSoul) cls += ' soul-palace';
    if (isBody) cls += ' body-palace';

    let allStars = [];
    if (palace.majorStars) allStars = allStars.concat(palace.majorStars);
    if (palace.minorStars) allStars = allStars.concat(palace.minorStars);
    if (palace.adjectiveStars) allStars = allStars.concat(palace.adjectiveStars);

    const majorStars = allStars.filter(s =>
      s.type==='major'||s.type==='tianma'||s.type==='lucun'||s.type==='soft'||s.type==='tough'
    );
    const otherStars = allStars.filter(s =>
      s.type==='helper'||s.type==='adjective'||s.type==='flower'
    );

    let starsHTML = '';
    if (majorStars.length > 0) {
      starsHTML += '<div class="palace-stars">';
      majorStars.forEach(s => {
        const lvl = brightnessLevel(s.brightness);
        const bm = s.brightness ? ' ['+s.brightness+']' : '';
        starsHTML += '<span class="star-tag '+lvl+'">'+s.name+bm+'</span>';
      });
      starsHTML += '</div>';
    }
    if (otherStars.length > 0) {
      const shown = otherStars.slice(0,3);
      starsHTML += '<div class="palace-stars">';
      shown.forEach(s => { starsHTML += '<span class="star-tag dim">'+s.name+'</span>'; });
      if (otherStars.length > 3) starsHTML += '<span class="star-tag dim">+'+ (otherStars.length-3)+'</span>';
      starsHTML += '</div>';
    }

    let badgesHTML = '';
    if (isSoul) badgesHTML += '<span class="palace-badge soul-badge">命宫</span>';
    if (isBody) badgesHTML += '<span class="palace-badge body-badge">身宫</span>';

    return '<div class="'+cls+'"><div class="palace-header"><span class="palace-stem">'+(palace.heavenlyStem||'')+'</span><span class="palace-branch">'+palace.earthlyBranch+'</span></div><span class="palace-name">'+palace.name+'</span>'+starsHTML+'<div class="palace-badges">'+badgesHTML+'</div></div>';
  }

  let gridHTML = '';
  for (let row=0; row<4; row++) {
    for (let col=0; col<4; col++) {
      if (row>=1 && row<=2 && col>=1 && col<=2) {
        if (row===1 && col===1) {
          gridHTML += '<div class="center-info">'+
            '<div class="center-name">'+(loc||userName)+'</div>'+
            '<div class="center-pillar">'+(data.chineseDate||'')+'</div>'+
            '<div class="center-meta">'+
            '<div class="center-meta-row"><span>命宫</span> '+(data.earthlyBranchOfSoulPalace||'—')+' <span>身宫</span> '+(data.earthlyBranchOfBodyPalace||'—')+'</div>'+
            '<div class="center-meta-row"><span>五行局</span> '+(data.fiveElementsClass||'—')+'</div>'+
            '<div class="center-meta-row"><span>命主</span> '+(data.soul||'—')+' <span>身主</span> '+(data.body||'—')+'</div>'+
            '<div class="center-meta-row"><span>'+(data.sign||'')+'</span> <span>属'+(data.zodiac||'')+'</span></div>'+
            '<div class="center-meta-row"><span>'+data.solarDate+'</span></div>'+
            '</div></div>';
        }
        continue;
      }
      let palace = null;
      for (const [branch,pos] of Object.entries(branchPositions)) {
        if (pos.row===row && pos.col===col) { palace = gridPalaces[branch]; break; }
      }
      if (palace) {
        gridHTML += renderPalaceCell(palace);
      } else {
        gridHTML += '<div class="palace-cell" style="opacity:0.3"><span class="palace-name" style="color:var(--text3)">—</span></div>';
      }
    }
  }

  document.getElementById('chartContent').innerHTML =
    '<div class="chart-grid-outer"><div class="chart-grid">'+gridHTML+'</div></div>';
}

  };

  const prompt = prompts[style] + '\n\n' + topicFocus[topic] + '\n\n🎭 额外任务：请根据命盘特征，推荐一位历史上或当代的名人（真实人物），其人生走向与这位用户最为相似。要求：\n1. 先简要介绍这位名人的生平（出生年份、主要成就、人生重大转折）\n2. 再说明为什么ta的人生走向与用户的命盘吻合（2-3句话）\n3. 将以上内容放在解读末尾，标题为"与你相似的命运"。\n\n命盘数据：\n' + JSON.stringify(summary, null, 2);

  try {
    const response = await fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKey
      },
      body: JSON.stringify({
        model: 'deepseek-chat',
        messages: [
          { role: 'system', content: '你是紫微斗数解读专家。你的解读基于命盘数据，所有内容仅供娱乐。根据用户选择的风格调整语气，忠于命盘数据不编造。' },
          { role: 'user', content: prompt }
        ],
        temperature: 0.8,
        max_tokens: 2048
      })
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error?.message || 'API 请求失败 (' + response.status + ')');
    }

    const result = await response.json();
    currentInterpretation = result.choices[0].message.content;
    aiContent.innerHTML = '<div class="interpretation-content">' + escapeHtml(currentInterpretation) + '</div>';
    document.getElementById('btnCopyInterpretation').style.display = '';
  } catch(e) {
    document.getElementById('btnCopyInterpretation').style.display = 'none';
    aiContent.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠</div><div class="empty-title">解读请求失败</div><div class="empty-sub">'+escapeHtml(e.message)+'<br>请检查 API Key 是否正确，或稍后重试</div></div>';
  }
}

function copyInterpretation() {
  if (!currentInterpretation) return;
  navigator.clipboard.writeText(currentInterpretation).then(() => {
    const btn = document.getElementById('btnCopyInterpretation');
    btn.textContent = '已复制';
    setTimeout(() => { btn.textContent = '复制'; }, 1500);
  }).catch(() => {
    const btn = document.getElementById('btnCopyInterpretation');
    btn.textContent = '失败';
    setTimeout(() => { btn.textContent = '复制'; }, 1500);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---- Boot ----
init();
</script>

</html>
