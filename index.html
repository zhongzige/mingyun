<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIXER ESTUDIO · 命运预测 V2.2</title>
<style>
/* =================================================================
   命运预测 V2.2 — Starry Dark Gold Theme
   星穹暗金风 · 深紫背景 · 金色点缀 · 星空粒子
   ================================================================= */
@font-face{font-family:'SF Pro Display';src:local('SF Pro Display'),local('SFProDisplay-Regular');font-weight:400;font-display:swap}
@font-face{font-family:'SF Pro Display';src:local('SF Pro Display'),local('SFProDisplay-Semibold');font-weight:600;font-display:swap}
@font-face{font-family:'SF Pro Text';src:local('SF Pro Text'),local('SFProText-Regular');font-weight:400;font-display:swap}
@font-face{font-family:'SF Pro Text';src:local('SF Pro Text'),local('SFProText-Semibold');font-weight:600;font-display:swap}
:root{
  --bg:#0a0612;--surface:#16101f;--card:#1c1428;--card2:#221a30;
  --b-sub:rgba(212,175,55,0.06);--b-mid:rgba(212,175,55,0.12);--b-hi:rgba(212,175,55,0.22);
  --text:#e8dfc8;--text2:rgba(232,223,200,0.7);--text3:rgba(232,223,200,0.4);
  --accent:#d4af37;--accent-hover:#e6c74f;--accent-text:#d4af37;
  --danger:#c0392b;--success:#27ae60;--warning:#d4af37;
  --star-bright:#ffd60a;--star-dim:rgba(232,223,200,0.35);
  --font-sans:'SF Pro Text',-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --font-display:'SF Pro Display','SF Pro Text',-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;
  --radius:8px;--radius-lg:12px;--radius-xl:16px;--transition:0.2s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-sans);font-size:14px;font-weight:400;
  letter-spacing:-0.22px;line-height:1.47;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;position:relative;
}
/* Starry particles */
body::before{
  content:'';position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1px 1px at 10% 15%,rgba(212,175,55,0.55),transparent),
    radial-gradient(1px 1px at 25% 35%,rgba(255,255,255,0.45),transparent),
    radial-gradient(1px 1px at 40% 10%,rgba(212,175,55,0.35),transparent),
    radial-gradient(1px 1px at 55% 50%,rgba(255,255,255,0.3),transparent),
    radial-gradient(1.2px 1.2px at 65% 20%,rgba(212,175,55,0.5),transparent),
    radial-gradient(1px 1px at 75% 65%,rgba(255,255,255,0.4),transparent),
    radial-gradient(1.5px 1.5px at 85% 30%,rgba(212,175,55,0.65),transparent),
    radial-gradient(1px 1px at 15% 70%,rgba(255,255,255,0.3),transparent),
    radial-gradient(1px 1px at 50% 80%,rgba(212,175,55,0.45),transparent),
    radial-gradient(1.5px 1.5px at 78% 88%,rgba(255,255,255,0.55),transparent),
    radial-gradient(1px 1px at 30% 55%,rgba(212,175,55,0.4),transparent),
    radial-gradient(1px 1px at 92% 45%,rgba(255,255,255,0.35),transparent);
  background-size:200px 200px;
}
body::after{
  content:'';position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(91,60,130,0.15),transparent 60%),
             radial-gradient(ellipse at 80% 100%,rgba(212,175,55,0.06),transparent 50%);
}
.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
/* ===== TOOLBAR ===== */
.toolbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 22px;height:48px;
  background:rgba(22,16,31,0.85);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:0.5px solid rgba(212,175,55,0.1);
  flex-shrink:0;gap:16px;position:sticky;top:0;z-index:100;
}
.toolbar-brand{display:flex;align-items:center;gap:10px}
.toolbar-logo{
  width:20px;height:20px;border-radius:5px;
  background:linear-gradient(135deg,#7f77dd,#d4537e,#d85a30);
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:white;
}
.toolbar-title{font-size:13px;font-weight:500;letter-spacing:-0.16px;color:var(--text)}
.toolbar-actions{display:flex;gap:8px;align-items:center}
/* ===== BUTTONS ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:5px 14px;border-radius:980px;font-size:12px;font-weight:400;
  letter-spacing:-0.12px;cursor:pointer;border:none;
  background:rgba(212,175,55,0.1);color:var(--text);
  transition:all var(--transition);font-family:var(--font-sans);white-space:nowrap;
}
.btn:hover{background:rgba(212,175,55,0.18)}
.btn-accent{background:var(--accent);color:#0a0612}
.btn-accent:hover{background:#e6c74f;box-shadow:0 4px 16px rgba(212,175,55,0.3)}
.btn-outline{background:transparent;color:var(--accent);border:0.5px solid rgba(212,175,55,0.4)}
.btn-outline:hover{background:rgba(212,175,55,0.08);border-color:var(--accent)}
.btn:active{transform:scale(0.97)}
.btn:disabled{opacity:0.3;cursor:not-allowed;pointer-events:none;transform:none}
/* ===== MAIN ===== */
.main{
  flex:1;display:flex;justify-content:center;padding:36px 28px 48px;
  overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.08) transparent;
}
.main::-webkit-scrollbar{width:4px}
.main::-webkit-scrollbar-track{background:transparent}
.main::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px}
.main-inner{width:100%;max-width:900px;display:flex;flex-direction:column;gap:20px}
/* ===== CARD BASE ===== */
.card{
  background:var(--card);border-radius:var(--radius-xl);
  border:0.5px solid rgba(212,175,55,0.08);padding:24px 28px;
}
.card-header{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;
}
.card-title{font-size:13px;font-weight:500;color:var(--text2);letter-spacing:-0.12px}
.card-badge{font-size:11px;color:var(--text3);letter-spacing:-0.08px}
/* ===== FORTUNE SLIP ===== */
.fortune-slip{
  background:linear-gradient(135deg,rgba(212,175,55,0.06),rgba(91,60,130,0.08));
  border-radius:var(--radius-xl);padding:20px 28px;
  border:0.5px solid rgba(212,175,55,0.1);
  text-align:center;cursor:pointer;transition:all 0.3s ease;
  user-select:none;
}
.fortune-slip:hover{transform:translateY(-2px);box-shadow:0 4px 24px rgba(212,175,55,0.1)}
.fortune-header{font-size:11px;color:var(--text3);letter-spacing:2px;margin-bottom:10px;text-transform:uppercase}
.fortune-slug{font-size:24px;font-weight:600;color:var(--text);letter-spacing:4px;margin:8px 0}
.fortune-sub{font-size:12px;color:var(--text2);letter-spacing:0;margin-top:6px}
.fortune-hint{font-size:10px;color:var(--text3);margin-top:10px;letter-spacing:1px}
/* ===== INPUT FORM ===== */
.form-grid{display:flex;flex-direction:column;gap:14px}
.form-row{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.input-group{display:flex;flex-direction:column;gap:5px}
.input-group label{font-size:11px;font-weight:400;color:var(--text3);letter-spacing:-0.08px}
.input-group input,.input-group select{
  background:var(--surface);border:0.5px solid rgba(212,175,55,0.08);
  border-radius:var(--radius);color:var(--text);
  font-family:var(--font-sans);font-size:14px;font-weight:400;
  padding:10px 12px;outline:none;transition:all var(--transition);
  -webkit-appearance:none;appearance:none;height:40px;
}
.input-group input:focus,.input-group select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(212,175,55,0.1)}
.input-group input:hover,.input-group select:hover{border-color:rgba(212,175,55,0.25)}
.input-group input::placeholder{color:rgba(255,255,255,0.2);font-size:13px}
.input-group select{
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='rgba(212,175,55,0.5)' stroke-width='1.2' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;padding-right:28px;cursor:pointer;
}
.input-name{width:160px}
.input-year{width:100px}.input-month{width:80px}.input-day{width:80px}
.input-province{width:130px}.input-city{width:130px}
.input-hour{width:80px}.input-minute{width:80px}
.time-convert{
  display:flex;align-items:center;gap:6px;
  font-size:12px;color:var(--accent-text);letter-spacing:-0.08px;
  padding:4px 10px;background:rgba(212,175,55,0.06);
  border-radius:var(--radius);white-space:nowrap;height:28px;align-self:flex-end;margin-bottom:6px;
}
.checkbox-row{
  display:flex;align-items:center;gap:6px;
  cursor:pointer;user-select:none;-webkit-user-select:none;
  align-self:flex-end;margin-bottom:5px;white-space:nowrap;
}
.checkbox-row input[type="checkbox"]{display:none}
.checkbox-box{
  width:16px;height:16px;border-radius:4px;
  border:1px solid rgba(255,255,255,0.2);
  display:flex;align-items:center;justify-content:center;
  transition:all var(--transition);flex-shrink:0;
}
.checkbox-row input:checked+.checkbox-box{background:var(--accent);border-color:var(--accent)}
.checkbox-box::after{
  content:'';display:block;width:4px;height:8px;
  border:solid #fff;border-width:0 1.5px 1.5px 0;
  transform:rotate(45deg) translateY(-1px);
  opacity:0;transition:opacity var(--transition);
}
.checkbox-row input:checked+.checkbox-box::after{opacity:1}
.checkbox-label{font-size:12px;color:var(--text3);letter-spacing:-0.08px}
/* ===== GENDER ===== */
.gender-toggle-v2{display:flex;gap:8px}
.gender-btn-v2{
  display:flex;align-items:center;gap:6px;
  padding:9px 20px;border-radius:var(--radius);
  font-size:13px;font-weight:400;font-family:var(--font-sans);
  cursor:pointer;border:0.5px solid rgba(212,175,55,0.15);
  background:var(--surface);color:var(--text2);
  transition:all var(--transition);letter-spacing:-0.08px;
}
.gender-btn-v2:hover{border-color:rgba(212,175,55,0.35);color:var(--text)}
.gender-btn-v2.active{background:var(--accent);border-color:var(--accent);color:#0a0612}
/* ===== BIG BUTTON ===== */
.btn-generate{
  padding:12px 36px;font-size:14px;font-weight:500;
  letter-spacing:2px;height:40px;
  background:linear-gradient(135deg,#d4af37,#c0922e);
  border:none;border-radius:var(--radius);
  color:#0a0612;cursor:pointer;font-family:var(--font-display);
  transition:all var(--transition);white-space:nowrap;
  box-shadow:0 2px 16px rgba(212,175,55,0.25);
}
.btn-generate:hover{box-shadow:0 4px 28px rgba(212,175,55,0.45);transform:translateY(-1px)}
.btn-generate:active{transform:scale(0.98) translateY(0)}
/* ===== API ===== */
.api-row{display:flex;align-items:center;gap:8px;padding-top:2px}
.api-label{font-size:11px;color:var(--text3);white-space:nowrap;letter-spacing:-0.08px}
.api-input{
  flex:1;background:var(--surface);border:0.5px solid rgba(255,255,255,0.08);
  border-radius:var(--radius);color:var(--text);padding:6px 10px;height:32px;
  font-family:var(--font-sans);font-size:11px;outline:none;
  transition:all var(--transition);letter-spacing:-0.08px;
}
.api-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(212,175,55,0.1)}
.api-input::placeholder{color:rgba(255,255,255,0.2)}
.api-status{font-size:10px;padding:3px 8px;border-radius:4px;white-space:nowrap;letter-spacing:-0.08px}
.api-status.set{color:var(--success);background:rgba(48,209,88,0.1)}
.api-status.unset{color:var(--text3);background:rgba(255,255,255,0.04)}
/* ===== TOOLTIP (Star Dictionary) ===== */
.star-tooltip{
  position:fixed;z-index:1000;max-width:280px;
  background:#16101f;border:0.5px solid rgba(212,175,55,0.2);
  border-radius:var(--radius-lg);padding:14px 16px;
  font-size:12px;line-height:1.6;color:var(--text2);
  box-shadow:0 8px 32px rgba(0,0,0,0.7),0 0 12px rgba(212,175,55,0.05);
  pointer-events:none;opacity:0;transition:opacity 0.15s ease;
  letter-spacing:-0.08px;
}
.star-tooltip.show{opacity:1}
.star-tooltip .tt-star{font-size:14px;font-weight:600;color:var(--star-bright);margin-bottom:6px;letter-spacing:-0.12px}
.star-tooltip .tt-desc{font-size:12px;color:var(--text2)}
.star-tooltip .tt-detail{font-size:10px;color:var(--text3);margin-top:4px}
.star-clickable{cursor:pointer;transition:all var(--transition)}
.star-clickable:hover{text-decoration:underline;text-decoration-color:rgba(255,255,255,0.3)}
/* ===== CHART ===== */
.chart-grid-outer{display:flex;justify-content:center;padding:8px 0}
.chart-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;grid-template-rows:auto auto auto auto;gap:6px;width:100%;max-width:760px}
.palace-cell{
  background:var(--surface);border-radius:var(--radius);
  border:0.5px solid rgba(212,175,55,0.06);
  padding:8px 10px;min-height:64px;
  transition:all var(--transition);cursor:default;
  display:flex;flex-direction:column;gap:2px;
}
.palace-cell:hover{border-color:rgba(212,175,55,0.15);background:#1c1630}
.palace-cell.soul-palace{border-color:rgba(212,175,55,0.4);box-shadow:inset 0 0 0 1px rgba(212,175,55,0.1)}
.palace-cell.body-palace{border-color:rgba(183,110,205,0.4);box-shadow:inset 0 0 0 1px rgba(183,110,205,0.1)}
.palace-header{display:flex;align-items:center;gap:6px}
.palace-branch{font-size:12px;font-weight:500;color:var(--text2)}
.palace-stem{font-size:10px;color:var(--text3);letter-spacing:0}
.palace-name{font-size:13px;font-weight:500;color:var(--text);line-height:1.2}
.palace-stars{display:flex;flex-wrap:wrap;gap:3px 6px;margin-top:2px}
.star-tag{font-size:11px;letter-spacing:-0.06px;line-height:1.3}
.star-tag.bright{color:var(--star-bright)}
.star-tag.medium{color:var(--text2)}
.star-tag.dim{color:var(--star-dim)}
.palace-badges{display:flex;gap:4px;margin-top:2px}
.palace-badge{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:400;letter-spacing:-0.06px}
.palace-badge.soul-badge{background:rgba(212,175,55,0.12);color:var(--accent)}
.palace-badge.body-badge{background:rgba(183,110,205,0.1);color:#b76ecd}
.center-info{
  background:var(--card2);border-radius:var(--radius);
  border:0.5px solid rgba(212,175,55,0.12);
  grid-column:2/4;grid-row:2/4;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:16px;gap:10px;text-align:center;
}
.center-name{font-size:16px;font-weight:600;color:var(--text);letter-spacing:-0.2px}
.center-pillar{font-size:20px;font-weight:400;color:var(--text);font-family:var(--font-display);letter-spacing:2px;line-height:1.4}
.center-meta{display:flex;flex-direction:column;gap:4px}
.center-meta-row{font-size:11px;color:var(--text3);letter-spacing:-0.08px;display:flex;gap:12px;justify-content:center}
.center-meta-row span{color:var(--text2)}
/* ===== RADAR CHART ===== */
.radar-container{
  display:flex;align-items:center;gap:32px;padding:8px 0;flex-wrap:wrap;justify-content:center;
}
.radar-svg{flex-shrink:0}
.radar-labels{display:flex;flex-direction:column;gap:12px}
.radar-label-item{display:flex;align-items:center;gap:8px}
.radar-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.radar-dot.career{background:rgba(0,113,227,0.8)}
.radar-dot.wealth{background:rgba(48,209,88,0.8)}
.radar-dot.love{background:rgba(255,69,58,0.8)}
.radar-name{font-size:12px;color:var(--text2);width:30px;letter-spacing:-0.08px}
.radar-score{font-size:14px;font-weight:600;color:var(--text);letter-spacing:-0.12px}
.radar-bar-bg{width:120px;height:4px;border-radius:2px;background:rgba(255,255,255,0.06);overflow:hidden}
.radar-bar-fill{height:100%;border-radius:2px;transition:width 0.6s ease}
.radar-bar-fill.career{background:rgba(0,113,227,0.8)}
.radar-bar-fill.wealth{background:rgba(48,209,88,0.8)}
.radar-bar-fill.love{background:rgba(255,69,58,0.8)}
/* ===== EMPTY STATE ===== */
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:48px 24px;text-align:center;gap:8px;
}
.empty-icon{font-size:32px;opacity:0.3}
.empty-title{font-size:14px;font-weight:400;color:var(--text2);letter-spacing:-0.12px}
.empty-sub{font-size:12px;color:var(--text3);letter-spacing:-0.08px;max-width:300px}
/* ===== AI ===== */
.interpretation-content{
  font-size:14px;line-height:1.8;color:var(--text2);
  letter-spacing:-0.12px;white-space:pre-wrap;word-break:break-word;
}
.interpretation-loading{display:flex;align-items:center;justify-content:center;padding:32px;gap:8px}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.1);border-top-color:var(--accent);border-radius:50%;animation:spin 0.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--text3);letter-spacing:-0.08px}
/* ===== FOOTER ===== */
.footer{
  border-top:0.5px solid rgba(212,175,55,0.08);
  padding:12px 22px 16px;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:8px;flex-shrink:0;
}
.footer-text{font-size:10px;color:var(--text3);letter-spacing:-0.06px}
.footer-link{color:var(--accent-text);text-decoration:none;font-size:10px}
.footer-link:hover{text-decoration:underline}
/* ===== TOAST ===== */
.toast{
  position:fixed;bottom:60px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--card);border:0.5px solid rgba(212,175,55,0.2);
  border-radius:var(--radius);padding:10px 24px;font-size:13px;color:var(--text);
  z-index:2000;box-shadow:0 8px 32px rgba(0,0,0,0.7);opacity:0;
  transition:all 0.3s ease;pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:700px){
  .chart-grid{grid-template-columns:1fr 1fr;gap:4px}
  .center-info{grid-column:1/3;grid-row:auto;min-height:100px}
  .form-row{gap:8px}
  .radar-container{flex-direction:column;gap:16px}
}
</style>
</head>
<body>
<div class="app">

<!-- Toolbar -->
<div class="toolbar">
  <div class="toolbar-brand">
    <div class="toolbar-logo">命</div>
    <span class="toolbar-title">FIXER ESTUDIO 命运预测工具</span>
  </div>
  <div class="toolbar-actions">
    <span class="api-status unset" id="apiStatus">未配置 API</span>
  </div>
</div>

<!-- Main -->
<div class="main">
<div class="main-inner">

<!-- Fortune Slip -->
<div class="fortune-slip" id="fortuneSlip" onclick="drawFortuneSlip()">
  <div class="fortune-header">✦ 今日运势签</div>
  <div class="fortune-slug" id="fortuneSlug">宜待机</div>
  <div class="fortune-sub" id="fortuneSub">点击求签 · 每日一次</div>
  <div class="fortune-hint" id="fortuneHint">今日已签 ✦ 明日再来</div>
</div>

<!-- Input Card -->
<div class="card" id="inputCard">
  <div class="card-header"><span class="card-title">输入生辰信息</span></div>
  <div class="form-grid">

    <div class="form-row">
      <div class="input-group">
        <label>姓名（可选）</label>
        <input type="text" id="userName" class="input-name" placeholder="匿名访客" maxlength="20">
      </div>
    </div>

    <div class="form-row">
      <div class="input-group">
        <label>出生日期（阳历）</label>
        <div style="display:flex;gap:6px">
          <select id="birthYear" class="input-year"><option value="">年</option></select>
          <select id="birthMonth" class="input-month"><option value="">月</option></select>
          <select id="birthDay" class="input-day"><option value="">日</option></select>
        </div>
      </div>
      <div class="input-group">
        <label>出生地点</label>
        <div style="display:flex;gap:6px">
          <select id="birthProvince" class="input-province"><option value="">省份</option></select>

    birthHour: document.getElementById('birthHour').value,
    birthMinute: document.getElementById('birthMinute').value,
    unknownTime: document.getElementById('unknownTime').checked,
    gender: getGender(),
    aiTopic: document.getElementById('aiTopic').value,
    aiStyle: document.getElementById('aiStyle').value,
  };
  try { localStorage.setItem(INPUT_KEY, JSON.stringify(data)); } catch(e) {}
}

function loadInput() {
  try {
    const raw = localStorage.getItem(INPUT_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e) { return null; }
}

// ===== AI 结果缓存 =====
function saveAiCache(inputSignature, interpretation) {
  try {
    localStorage.setItem(AI_CACHE_KEY, JSON.stringify({
      sig: inputSignature,
      text: interpretation,
      time: Date.now()
    }));
  } catch(e) {} // 解读文本可能较长，超 quota 静默失败
}

function loadAiCache() {
  try {
    const raw = localStorage.getItem(AI_CACHE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e) { return null; }
}

function getInputSignature() {
  return [getSolarDate(), getTimeIndex(), getGender(), getUserName(),
    document.getElementById('aiTopic').value, document.getElementById('aiStyle').value].join('|');
}

// ===== Init =====
function init() {
  document.getElementById('apiKey').value = apiKey;
  updateApiStatus();

  populateYearSelect();
  populateMonthSelect();
  populateHourSelect();
  populateMinuteSelect();
  populateProvinceSelect();
  updateFortuneSlip();

  document.getElementById('btnGenerate').addEventListener('click', generateChart);
  document.getElementById('btnSaveKey').addEventListener('click', saveApiKey);
  document.getElementById('btnCopyInterpretation').addEventListener('click', copyInterpretation);
  const btnRetry = document.getElementById('btnRetryAi');
  if (btnRetry) btnRetry.addEventListener('click', () => { if (currentChartData) runAiInterpretation(currentChartData, getUserName()); });

  document.getElementById('birthYear').addEventListener('change', () => { updateDaySelect(); saveInput(); });
  document.getElementById('birthMonth').addEventListener('change', () => { updateDaySelect(); saveInput(); });
  document.getElementById('birthProvince').addEventListener('change', () => { updateCitySelect(); saveInput(); });
  document.getElementById('birthCity').addEventListener('change', () => { updateTimeConvert(); saveInput(); });
  document.getElementById('birthHour').addEventListener('change', () => { updateTimeConvert(); saveInput(); });
  document.getElementById('birthMinute').addEventListener('change', () => { updateTimeConvert(); saveInput(); });
  document.getElementById('unknownTime').addEventListener('change', () => { toggleUnknownTime(); saveInput(); });
  document.getElementById('userName').addEventListener('input', saveInput);
  document.getElementById('aiTopic').addEventListener('change', saveInput);
  document.getElementById('aiStyle').addEventListener('change', saveInput);

  document.querySelectorAll('.gender-btn-v2').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.gender-btn-v2').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      saveInput();
    });
  });

  // 恢复上次输入
  const saved = loadInput();
  if (saved) {
    if (saved.birthYear) document.getElementById('birthYear').value = saved.birthYear;
    if (saved.birthMonth) document.getElementById('birthMonth').value = saved.birthMonth;
    updateDaySelect();
    if (saved.birthDay) document.getElementById('birthDay').value = saved.birthDay;
    if (saved.birthProvince) { document.getElementById('birthProvince').value = saved.birthProvince; updateCitySelect(); }
    if (saved.birthCity) document.getElementById('birthCity').value = saved.birthCity;
    if (saved.birthHour) document.getElementById('birthHour').value = saved.birthHour;
    if (saved.birthMinute) document.getElementById('birthMinute').value = saved.birthMinute;
    if (saved.userName) document.getElementById('userName').value = saved.userName;
    if (saved.aiTopic) document.getElementById('aiTopic').value = saved.aiTopic;
    if (saved.aiStyle) document.getElementById('aiStyle').value = saved.aiStyle;
    if (saved.unknownTime) { document.getElementById('unknownTime').checked = true; toggleUnknownTime(); }
    if (saved.gender) {
      document.querySelectorAll('.gender-btn-v2').forEach(b => {
        b.classList.toggle('active', b.dataset.gender === saved.gender);
      });
    }
    updateTimeConvert();
  } else {
    // 默认值
    document.getElementById('birthYear').value = '2000';
    document.getElementById('birthMonth').value = '1';
    updateDaySelect();
    document.getElementById('birthDay').value = '1';
    document.getElementById('birthHour').value = '12';
    document.getElementById('birthMinute').value = '0';
  }

  // 恢复上次 AI 解读缓存
  const aiCache = loadAiCache();
  if (aiCache && aiCache.text) {
    currentInterpretation = aiCache.text;
  }

  // Close tooltip on click outside
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.star-clickable')) {
      document.getElementById('starTooltip').classList.remove('show');
    }
  });
}

// ===== FORTUNE SLIP =====
function updateFortuneSlip() {
  const today = new Date().toISOString().split('T')[0];
  if (lastFortuneDate === today && lastFortuneNote) {
    document.getElementById('fortuneSlug').textContent = lastFortuneNote;
    document.getElementById('fortuneSub').textContent = lastFortuneSub || '今日已签 · 明日再来';
    document.getElementById('fortuneHint').style.display = '';
    document.getElementById('fortuneSlip').style.cursor = 'default';
    document.getElementById('fortuneSlip').style.opacity = '0.6';
  } else {
    document.getElementById('fortuneHint').style.display = 'none';
    document.getElementById('fortuneSlip').style.cursor = 'pointer';
    document.getElementById('fortuneSlip').style.opacity = '1';
  }
}

function drawFortuneSlip() {
  const today = new Date().toISOString().split('T')[0];
  if (lastFortuneDate === today) return;
  const slip = fortuneSlips[Math.floor(Math.random() * fortuneSlips.length)];
  document.getElementById('fortuneSlug').textContent = slip.slug;
  document.getElementById('fortuneSub').textContent = slip.sub;
  localStorage.setItem('fortune_date', today);
  localStorage.setItem('fortune_note', slip.slug);
  localStorage.setItem('fortune_sub', slip.sub);
  lastFortuneDate = today;
  lastFortuneNote = slip.slug;
  lastFortuneSub = slip.sub;
  updateFortuneSlip();
}

// ===== POPULATE SELECTORS =====
function populateYearSelect(){const s=document.getElementById('birthYear');for(let y=2030;y>=1900;y--){const o=document.createElement('option');o.value=y;o.textContent=y+'年';s.appendChild(o)}}
function populateMonthSelect(){const s=document.getElementById('birthMonth');for(let m=1;m<=12;m++){const o=document.createElement('option');o.value=m;o.textContent=m+'月';s.appendChild(o)}}
function updateDaySelect(){const y=parseInt(document.getElementById('birthYear').value);const m=parseInt(document.getElementById('birthMonth').value);const s=document.getElementById('birthDay');s.innerHTML='<option value="">日</option>';if(!y||!m)return;const days=new Date(y,m,0).getDate();for(let d=1;d<=days;d++){const o=document.createElement('option');o.value=d;o.textContent=d+'日';s.appendChild(o)}}
function populateHourSelect(){const s=document.getElementById('birthHour');for(let h=0;h<=23;h++){const o=document.createElement('option');o.value=h;o.textContent=String(h).padStart(2,'0');s.appendChild(o)}}
function populateMinuteSelect(){const s=document.getElementById('birthMinute');for(let m=0;m<=59;m++){const o=document.createElement('option');o.value=m;o.textContent=String(m).padStart(2,'0');s.appendChild(o)}}
function populateProvinceSelect(){const s=document.getElementById('birthProvince');const order=['北京','上海','天津','重庆','河北','山西','内蒙古','辽宁','吉林','黑龙江','江苏','浙江','安徽','福建','江西','山东','河南','湖北','湖南','广东','广西','海南','四川','贵州','云南','西藏','陕西','甘肃','青海','宁夏','新疆','香港','澳门','台湾'];const p=Object.keys(cityData).sort((a,b)=>order.indexOf(a)-order.indexOf(b));p.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;s.appendChild(o)})}
function updateCitySelect(){const p=document.getElementById('birthProvince').value;const s=document.getElementById('birthCity');s.innerHTML='<option value="">城市</option>';if(!p||!cityData[p])return;cityData[p].forEach(c=>{const o=document.createElement('option');o.value=JSON.stringify(c);o.textContent=c.name;s.appendChild(o)});updateTimeConvert()}

// ===== TIME =====
function getSelectedCityLongitude(){const v=document.getElementById('birthCity').value;if(!v)return null;try{return JSON.parse(v).lng}catch(e){return null}}
function getTrueSolarTime(){const h=parseInt(document.getElementById('birthHour').value);const m=parseInt(document.getElementById('birthMinute').value);const lng=getSelectedCityLongitude();if(isNaN(h)||isNaN(m))return null;if(lng===null)return{hour:h,minute:m,offset:0};const off=Math.round((120-lng)*4);let tm=h*60+m+off;if(tm<0)tm+=1440;if(tm>=1440)tm-=1440;return{hour:Math.floor(tm/60),minute:tm%60,offset:off}}
function timeToIndex(h,m){if(h===23)return 12;if(h===0)return 0;return Math.floor((h+1)/2)}
function getShichenName(i){const n=['子时','丑时','寅时','卯时','辰时','巳时','午时','未时','申时','酉时','戌时','亥时'];return i===12?'子时':n[i]||'未知'}
function getShichenRange(i){const r=['23:00-01:00','01:00-03:00','03:00-05:00','05:00-07:00','07:00-09:00','09:00-11:00','11:00-13:00','13:00-15:00','15:00-17:00','17:00-19:00','19:00-21:00','21:00-23:00'];return i===12?'23:00-01:00':r[i]||''}
function updateTimeConvert(){const u=document.getElementById('unknownTime').checked;const el=document.getElementById('timeConvert');const tx=document.getElementById('timeConvertText');if(u){el.style.display='none';return}const ts=getTrueSolarTime();if(!ts){el.style.display='none';return}const i=timeToIndex(ts.hour,ts.minute);const nm=getShichenName(i);const rg=getShichenRange(i);el.style.display='flex';tx.textContent=ts.offset===0?nm+' '+rg:nm+' '+rg+' (偏差'+(ts.offset>0?'+':'')+ts.offset+'分)'}
function toggleUnknownTime(){const u=document.getElementById('unknownTime').checked;const tg=document.getElementById('timeGroup');const tc=document.getElementById('timeConvert');if(u){tg.style.opacity='0.35';tg.style.pointerEvents='none';tc.style.display='none';document.getElementById('birthHour').value='12';document.getElementById('birthMinute').value='0'}else{tg.style.opacity='1';tg.style.pointerEvents='auto';updateTimeConvert()}}

// ===== GENERATE CHART =====
function generateChart(){
  const solarDate=getSolarDate();
  if(!solarDate){showToast('请填写出生日期（年/月/日）');return}
  saveInput();
  const timeIndex=getTimeIndex();
  const gender=getGender();
  const userName=getUserName();
  if(typeof iztro==='undefined'||!iztro.astro){
    document.getElementById('chartContent').innerHTML='<div class="empty-state"><div class="empty-icon">⚠</div><div class="empty-title">排盘引擎加载失败</div><div class="empty-sub">请检查网络连接后刷新页面重试</div></div>';
    return
  }
  let data;
  try{data=iztro.astro.bySolar(solarDate,timeIndex,gender,true,'zh-CN')}
  catch(e){document.getElementById('chartContent').innerHTML='<div class="empty-state"><div class="empty-icon">⚠</div><div class="empty-title">排盘失败</div><div class="empty-sub">'+escapeHtml(e.message)+'</div></div>';return}
  currentChartData=data;
  renderChart(data,userName);
  renderRadar(data);
  const topic=document.getElementById('aiTopic').value;
  currentHoroscope=null;
  if(topic==='horoscope'&&typeof data.horoscope==='function'){
    try{const h=data.horoscope(new Date());currentHoroscope={solarDate:h.solarDate,lunarDate:h.lunarDate,decadal:h.decadal?{index:h.decadal.index,heavenlyStem:h.decadal.heavenlyStem,earthlyBranch:h.decadal.earthlyBranch,palaceNames:h.decadal.palaceNames,mutagen:h.decadal.mutagen}:null,yearly:h.yearly?{index:h.yearly.index,heavenlyStem:h.yearly.heavenlyStem,earthlyBranch:h.yearly.earthlyBranch,palaceNames:h.yearly.palaceNames,mutagen:h.yearly.mutagen}:null}}
    catch(e){currentHoroscope=null}
  }

  // AI 解读：检查缓存是否匹配当前输入
  if(apiKey){
    document.getElementById('aiCard').style.display='';
    const sig = getInputSignature();
    const cache = loadAiCache();
    if (cache && cache.sig === sig && cache.text) {
      // 缓存命中，直接显示，不消耗 API
      currentInterpretation = cache.text;
      renderAiContent(cache.text);
    } else {
      // 缓存不匹配，发起请求
      runAiInterpretation(data,userName);
    }
  } else {
    document.getElementById('aiCard').style.display='none';
  }
}

// ===== RENDER CHART (with star tooltip) =====
function renderChart(data,userName){
  const soulBranch=data.earthlyBranchOfSoulPalace;
  const bodyBranch=data.earthlyBranchOfBodyPalace;
  const loc=getLocationName();
  document.getElementById('chartBadge').textContent=userName+' · '+data.solarDate+' · '+data.time;
  let gridPalaces={};
  data.palaces.forEach(p=>{const pos=branchPositions[p.earthlyBranch];if(pos)gridPalaces[p.earthlyBranch]=p});
  function renderPalaceCell(palace){
    const isSoul=palace.earthlyBranch===soulBranch;
    const isBody=palace.earthlyBranch===bodyBranch;
    let cls='palace-cell';
    if(isSoul)cls+=' soul-palace';if(isBody)cls+=' body-palace';
    let allStars=[];
    if(palace.majorStars)allStars=allStars.concat(palace.majorStars);
    if(palace.minorStars)allStars=allStars.concat(palace.minorStars);
    if(palace.adjectiveStars)allStars=allStars.concat(palace.adjectiveStars);
    const majorStars=allStars.filter(s=>s.type==='major'||s.type==='tianma'||s.type==='lucun'||s.type==='soft'||s.type==='tough');
    const otherStars=allStars.filter(s=>s.type==='helper'||s.type==='adjective'||s.type==='flower');
    let starsHTML='';
    if(majorStars.length>0){starsHTML+='<div class="palace-stars">';majorStars.forEach(s=>{const lvl=brightnessLevel(s.brightness);const bm=s.brightness?' ['+s.brightness+']':'';starsHTML+='<span class="star-tag '+lvl+' star-clickable" data-star="'+escapeAttr(s.name)+'">'+escapeHtml(s.name)+bm+'</span>'});starsHTML+='</div>'}
    if(otherStars.length>0){const shown=otherStars.slice(0,3);starsHTML+='<div class="palace-stars">';shown.forEach(s=>{starsHTML+='<span class="star-tag dim star-clickable" data-star="'+escapeAttr(s.name)+'">'+escapeHtml(s.name)+'</span>'});if(otherStars.length>3)starsHTML+='<span class="star-tag dim">+'+ (otherStars.length-3)+'</span>';starsHTML+='</div>'}
    let badgesHTML='';
    if(isSoul)badgesHTML+='<span class="palace-badge soul-badge">命宫</span>';
    if(isBody)badgesHTML+='<span class="palace-badge body-badge">身宫</span>';
    return '<div class="'+cls+'"><div class="palace-header"><span class="palace-stem">'+(palace.heavenlyStem||'')+'</span><span class="palace-branch">'+palace.earthlyBranch+'</span></div><span class="palace-name">'+palace.name+'</span>'+starsHTML+'<div class="palace-badges">'+badgesHTML+'</div></div>';
  }
  let gridHTML='';
  for(let row=0;row<4;row++){for(let col=0;col<4;col++){
    if(row>=1&&row<=2&&col>=1&&col<=2){
      if(row===1&&col===1){
        gridHTML+='<div class="center-info"><div class="center-name">'+(loc||userName)+'</div><div class="center-pillar">'+(data.chineseDate||'')+'</div><div class="center-meta"><div class="center-meta-row"><span>命宫</span> '+(data.earthlyBranchOfSoulPalace||'—')+' <span>身宫</span> '+(data.earthlyBranchOfBodyPalace||'—')+'</div><div class="center-meta-row"><span>五行局</span> '+(data.fiveElementsClass||'—')+'</div><div class="center-meta-row"><span>命主</span> '+(data.soul||'—')+' <span>身主</span> '+(data.body||'—')+'</div><div class="center-meta-row"><span>'+(data.sign||'')+'</span> <span>属'+(data.zodiac||'')+'</span></div><div class="center-meta-row"><span>'+data.solarDate+'</span></div></div></div>';
      }
      continue;
    }
    let palace=null;
    for(const [b,p] of Object.entries(branchPositions)){if(p.row===row&&p.col===col){palace=gridPalaces[b];break}}
    if(palace){gridHTML+=renderPalaceCell(palace)}
    else{gridHTML+='<div class="palace-cell" style="opacity:0.3"><span class="palace-name" style="color:var(--text3)">—</span></div>'}
  }}
  document.getElementById('chartContent').innerHTML='<div class="chart-grid-outer"><div class="chart-grid">'+gridHTML+'</div></div>';
  // 事件委托：星曜点击
  document.getElementById('chartContent').querySelectorAll('.star-clickable').forEach(el=>{
    el.addEventListener('click',(e)=>{
      e.stopPropagation();
      showStarTooltip(e, el.dataset.star);
    });
  });
}

// ===== STAR TOOLTIP =====
function showStarTooltip(event,starName){
  const info=starDict[starName];
  if(!info)return;
  const tt=document.getElementById('starTooltip');
  tt.innerHTML='<div class="tt-star">'+starName+' <span style="font-size:10px;color:var(--text3);font-weight:400">'+info.type+'</span></div><div class="tt-desc">'+info.desc+'</div><div class="tt-detail">'+info.detail+'</div>';
  const x=event.clientX+12;
  const y=event.clientY-10;
  tt.style.left=Math.min(x,window.innerWidth-295)+'px';
  tt.style.top=y+'px';
  tt.classList.add('show');
}

// ===== RADAR CHART =====
function scorePalaceStars(palace){
  if(!palace)return 5;
  let score=5;
  palace.majorStars?.forEach(s=>{if(s.brightness==='庙'||s.brightness==='旺')score+=1.5;else if(s.brightness==='得')score+=0.8;else if(s.brightness==='陷'||s.brightness==='不')score-=0.8});
  palace.minorStars?.forEach(s=>{if(s.type==='soft')score+=0.5;if(s.type==='tough')score-=0.3});
  return Math.max(1,Math.min(10,Math.round(score)));
}
function renderRadar(data){
  const palaces={};
  data.palaces.forEach(p=>{palaces[p.name]=p});
  const careerScore=scorePalaceStars(palaces['官禄']||palaces['事业']);
  const wealthScore=scorePalaceStars(palaces['财帛']);
  const loveScore=scorePalaceStars(palaces['夫妻']);
  document.getElementById('radarCard').style.display='';

  // SVG radar
  const cx=120,cy=120,r=90;
  let svg='<svg viewBox="0 0 240 240" width="260" height="260" class="radar-svg">';
  // Background grid
  for(let i=1;i<=3;i++){const rr=r/3*i;svg+='<polygon points="'+(cx)+','+(cy-rr)+' '+(cx+rr*0.866)+','+(cy+rr*0.5)+' '+(cx-rr*0.866)+','+(cy+rr*0.5)+'" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>'}
  // Axes
  svg+='<line x1="'+cx+'" y1="'+cy+'" x2="'+cx+'" y2="'+(cy-r)+'" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>';
  svg+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+r*0.866)+'" y2="'+(cy+r*0.5)+'" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>';
  svg+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx-r*0.866)+'" y2="'+(cy+r*0.5)+'" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>';
  // Data polygon
  const cR=careerScore/10*r,wR=wealthScore/10*r,lR=loveScore/10*r;
  svg+='<polygon points="'+(cx)+','+(cy-cR)+' '+(cx+wR*0.866)+','+(cy+wR*0.5)+' '+(cx-lR*0.866)+','+(cy+lR*0.5)+'" fill="rgba(0,113,227,0.12)" stroke="rgba(0,113,227,0.4)" stroke-width="1.5"/>';
  // Dots
  svg+='<circle cx="'+cx+'" cy="'+(cy-cR)+'" r="4" fill="#0071e3"/>';
  svg+='<circle cx="'+(cx+wR*0.866)+'" cy="'+(cy+wR*0.5)+'" r="4" fill="#30d158"/>';
  svg+='<circle cx="'+(cx-lR*0.866)+'" cy="'+(cy+lR*0.5)+'" r="4" fill="#ff453a"/>';
  // Labels
  svg+='<text x="'+cx+'" y="'+(cy-r-12)+'" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="11">事业</text>';
  svg+='<text x="'+(cx+r*0.866+14)+'" y="'+(cy+r*0.5+4)+'" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="11">财运</text>';
  svg+='<text x="'+(cx-r*0.866-14)+'" y="'+(cy+r*0.5+4)+'" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="11">感情</text>';
  svg+='</svg>';

  let bars='<div class="radar-labels">'+
    '<div class="radar-label-item"><div class="radar-dot career"></div><span class="radar-name">事业</span><div class="radar-bar-bg"><div class="radar-bar-fill career" style="width:'+(careerScore*10)+'%"></div></div><span class="radar-score">'+careerScore+'</span></div>'+
    '<div class="radar-label-item"><div class="radar-dot wealth"></div><span class="radar-name">财运</span><div class="radar-bar-bg"><div class="radar-bar-fill wealth" style="width:'+(wealthScore*10)+'%"></div></div><span class="radar-score">'+wealthScore+'</span></div>'+
    '<div class="radar-label-item"><div class="radar-dot love"></div><span class="radar-name">感情</span><div class="radar-bar-bg"><div class="radar-bar-fill love" style="width:'+(loveScore*10)+'%"></div></div><span class="radar-score">'+loveScore+'</span></div>'+
    '</div>';
  document.getElementById('radarContent').innerHTML='<div class="radar-container">'+svg+bars+'</div>';
}

// 简单 markdown 渲染：**加粗** → <strong>，换行保留（CSS pre-wrap）
function renderMarkdown(text) {
  let html = escapeHtml(text);
  // **加粗**
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // 标题行（开头是 # 或 ##）
  html = html.replace(/^#{1,3}\s+(.+)$/gm, '<strong style="color:var(--accent)">$1</strong>');
  return html;
}

function renderAiContent(text) {
  const aiContent = document.getElementById('aiContent');

  document.getElementById('btnCopyInterpretation').style.display = '';
  document.getElementById('btnRetryAi').style.display = '';
}

    chat:'你是一位风趣幽默的命理师朋友。请根据以下命盘数据，为用户"'+userName+'"做一份"仅供娱乐"的命运解读。要求：现代轻松的白话，像朋友间微信聊天。篇幅400-600字。必须在开头加上「⚠️ 仅供娱乐，命运在自己手中」',master:'你是一位深谙紫微斗数的专业命理师。请根据以下命盘数据，为用户"'+userName+'"做一份命运解读。要求：专业命理师口吻，半文半白但不故弄玄虚。篇幅500-800字。必须在开头加上「⚠️ 仅供娱乐，命运在自己手中」',counselor:'你是一位擅长结合命理的心理咨询师。请根据以下命盘数据，为用户"'+userName+'"做一份解读。要求：温柔共情，像心理咨询师一样倾听和引导。篇幅500-700字。必须在开头加上「⚠️ 仅供娱乐，命运在自己手中」',roast:'你是一位毒舌但善良的命理师。请根据以下命盘数据，为用户"'+userName+'"做一份毒舌解读。要求：犀利吐槽但带着善意，让人又想打你又忍不住笑。篇幅400-600字。必须在开头加上「⚠️ 仅供娱乐，命运在自己手中」',plain:'你是一位冷静的命盘叙述者。请根据以下命盘数据，为用户"'+userName+'"做一份直白解读。要求：平实直述，像播报新闻。不用比喻典故华丽词藻。篇幅300-500字。必须在开头加上「⚠️ 仅供娱乐，命运在自己手中」'
  };
  const summary={name:userName,solarDate:data.solarDate,lunarDate:data.lunarDate,chineseDate:data.chineseDate,time:data.time,sign:data.sign,zodiac:data.zodiac,gender:getGender(),fiveElementsClass:data.fiveElementsClass,soulPalace:data.earthlyBranchOfSoulPalace,bodyPalace:data.earthlyBranchOfBodyPalace,soul:data.soul,body:data.body,palaces:data.palaces.map(p=>({name:p.name,branch:p.earthlyBranch,stem:p.heavenlyStem,majorStars:(p.majorStars||[]).map(s=>({name:s.name,brightness:s.brightness})),minorStars:(p.minorStars||[]).map(s=>s.name),isBodyPalace:p.isBodyPalace,isOriginalPalace:p.isOriginalPalace,changsheng12:p.changsheng12}))};
  const prompt=prompts[style]+'\n\n'+topicFocus[topic]+'\n\n🎭 额外任务：请根据命盘特征，推荐一位历史上或当代的名人（真实人物），其人生走向与这位用户最为相似。要求：先简要介绍名人生平（出生年份、主要成就、人生重大转折），再说明为什么ta的人生走向与用户的命盘吻合。放在解读末尾，标题为"与你相似的命运"。\n\n命盘数据：\n'+JSON.stringify(summary,null,2);

  // 60 秒超时
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 60000);
  try{
    const response=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},body:JSON.stringify({model:'deepseek-chat',messages:[{role:'system',content:'你是紫微斗数解读专家。你的解读基于命盘数据，所有内容仅供娱乐。根据用户选择的风格调整语气，忠于命盘数据不编造。'},{role:'user',content:prompt}],temperature:0.8,max_tokens:4096}),signal:controller.signal});
    clearTimeout(timeoutId);
    if(!response.ok){const err=await response.json().catch(()=>({}));throw new Error(err.error?.message||'API 请求失败 ('+response.status+')')}
    const result=await response.json();
    currentInterpretation=result.choices[0].message.content;
    // 缓存解读结果
    saveAiCache(getInputSignature(), currentInterpretation);
    renderAiContent(currentInterpretation);
  }catch(e){
    clearTimeout(timeoutId);
    document.getElementById('btnCopyInterpretation').style.display='none';
    const isTimeout = e.name === 'AbortError';
    document.getElementById('btnRetryAi').style.display = '';
    aiContent.innerHTML='<div class="empty-state"><div class="empty-icon">⚠</div><div class="empty-title">'+(isTimeout?'请求超时':'解读请求失败')+'</div><div class="empty-sub">'+escapeHtml(isTimeout?'AI 响应超过 60 秒，请点击"重新解读"重试':e.message)+'<br>请检查 API Key 是否正确，或稍后重试</div></div>'
  } finally {
    isAiLoading = false;
    btnGen.disabled = false;
    btnGen.textContent = '立即起盘 · 解命运密码';
  }
}

function copyInterpretation(){
  if(!currentInterpretation)return;
  // 优先用 Clipboard API，失败时 fallback 到 textarea + execCommand
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(currentInterpretation).then(()=>{
      const b=document.getElementById('btnCopyInterpretation');b.textContent='已复制';setTimeout(()=>b.textContent='复制',1500);
      showToast('已复制到剪贴板');
    }).catch(()=>{ fallbackCopy(); });
  } else {
    fallbackCopy();
  }
}

function fallbackCopy(){
  const ta=document.createElement('textarea');
  ta.value=currentInterpretation;
  ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');const b=document.getElementById('btnCopyInterpretation');b.textContent='已复制';setTimeout(()=>b.textContent='复制',1500);showToast('已复制到剪贴板')}
  catch(e){showToast('复制失败，请手动选择文本')}
  document.body.removeChild(ta);
}

function escapeHtml(str){const d=document.createElement('div');d.textContent=str;return d.innerHTML}
function escapeAttr(str){return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// ===== TOAST =====
let _toastTimer=null;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  if(_toastTimer){clearTimeout(_toastTimer);_toastTimer=null}
  _toastTimer=setTimeout(()=>{el.classList.remove('show');_toastTimer=null},2200);
}

// ---- Boot ----
init();
</script>
